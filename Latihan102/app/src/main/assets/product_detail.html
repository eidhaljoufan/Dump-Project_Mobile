<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Detail Produk</title>
    <style>
        body { font-family: Arial, sans-serif; background-
color: #f5f5f5; margin: 0; padding: 20px; }
        .product-detail { background: white; border-radius:
8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-detail img { max-width: 100%; border-radius:
8px; }
        .product-detail h2 { font-size: 20px; margin: 10px 0;
}
        .product-detail p { margin: 10px 0; }
        .quantity { display: flex; align-items: center; gap:
10px; margin: 20px 0; }
        .quantity input { width: 50px; padding: 5px; }
        .add-to-cart { background: #3498db; color: white;
        border: none; padding: 10px; width: 100%; border-radius: 5px;
cursor: pointer; transition: transform 0.3s; }
        .add-to-cart:hover { transform: scale(1.05); }
        .reviews { margin-top: 20px; }
        .review { border-bottom: 1px solid #ddd; padding: 10px
0; }
    </style>
</head>
<body>
<div class="product-detail">
    <img id="productImage"
         src="https://images.unsplash.com/photo-1497034825429-
c343d7c6a68f" alt="Product">
    <h2 id="productName"></h2>
    <p id="productPrice"></p>
    <p id="productDescription"></p>
    <div class="quantity">
        <label for="quantity">Jumlah:</label>
        <input type="number" id="quantity" min="1" max="10"
               value="1">
    </div>
    <button class="add-to-cart" onclick="addToCart()">Tambah
        ke Keranjang</button>
    <div class="reviews">
        <h3>Ulasan</h3>
        <div id="reviews"></div>
    </div>
</div>
<script>
    const params = new
URLSearchParams(window.location.search);
    document.getElementById('productName').innerText =
params.get('name') || 'Nama Produk';
    document.getElementById('productPrice').innerText =
params.get('price') || 'Harga';
    document.getElementById('productDescription').innerText =
params.get('description') || 'Deskripsi';
    document.getElementById('productImage').src =
params.get('image') || 'https://images.unsplash.com/photo-
1497034825429-c343d7c6a68f';
    const reviews = JSON.parse(params.get('reviews') || '[]');
    const reviewsDiv = document.getElementById('reviews');
    reviews.forEach(review => {
        const div = document.createElement('div');
        div.className = 'review';
        div.innerHTML = `<strong>${review.user}</strong>:
${review.comment} (${review.rating}/5)`;
        reviewsDiv.appendChild(div);
    });
    function addToCart() {
        const quantity =
parseInt(document.getElementById('quantity').value);
        if (quantity > 10) {
            alert('Maksimal 10 item');
            return;
        }
        window.android.addToCart(
            params.get('id'),
            params.get('name'),
            parseInt(params.get('price').replace('Rp ',
'').replace('.', '')),
